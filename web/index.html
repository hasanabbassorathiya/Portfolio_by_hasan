<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of Hasan Abbas Sorathiya · Mobile Engineering Lead & Flutter Architect in Dubai. FinTech, enterprise mobility, and AI-powered applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hasan Abbas Sorathiya · Mobile Engineering Lead | Flutter Architect</title>

  <style>
    body { margin: 0; padding: 0; background: #09090B; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #09090B;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      transition: opacity 0.4s ease-out;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading .name {
      font-size: 14px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      color: #A1A1AA; margin-bottom: 32px;
    }
    #loading .bar-track {
      width: 200px; height: 3px; background: #27272A; position: relative;
    }
    #loading .bar-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: #38BDF8;
      animation: fill 2.5s ease-in-out forwards;
    }
    #loading .bar-glow {
      position: absolute; top: -2px; right: -4px; width: 8px; height: 7px;
      background: #38BDF8;
      box-shadow: 0 0 12px #38BDF8, 0 0 24px rgba(56,189,248,0.3);
    }
    @keyframes fill { 0% { width: 0%; } 60% { width: 85%; } 100% { width: 100%; } }
    #loading .dots { display: flex; gap: 6px; margin-top: 24px; }
    #loading .dot {
      width: 4px; height: 4px; background: #3F3F46;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #loading .dot:nth-child(2) { animation-delay: 0.2s; }
    #loading .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { background: #3F3F46; transform: scale(1); }
      50% { background: #38BDF8; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="name">HASAN ABBAS</div>
    <div class="bar-track">
      <div class="bar-fill"><div class="bar-glow"></div></div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Remove loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
