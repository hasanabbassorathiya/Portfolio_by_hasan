name: portfolio
description: "HS Portfolio — Mobile Engineering Lead | Flutter Architect"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^17.2.2

  # Fonts
  google_fonts: ^6.2.1

  # Icons & SVG
  flutter_svg: ^2.0.10+1

  # URLs
  url_launcher: ^6.2.2
  url_strategy: ^0.3.0

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  firebase_auth_web: ^5.8.13
  firebase_analytics: ^11.5.0
  firebase_crashlytics: ^4.3.7
  firebase_performance: ^0.10.1+7
  firebase_remote_config: ^5.1.4

  # Animations
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0

  # HTTP
  http: ^1.2.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Localization
  intl: ^0.20.2

  # HTML rendering
  flutter_html: ^3.0.0-beta.2

  # Logging
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_core_platform_interface: ^6.0.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0A0A0F"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/blogs/
    - assets/clients/
    - assets/works/
    - .env
