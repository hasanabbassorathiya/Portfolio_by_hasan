name: Deploy Preview to Firebase Hosting

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy-preview:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app (Release)
        run: |
          flutter clean
          flutter build web --release \
            --base-href / \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=APP_NAME="${{ secrets.APP_NAME || 'Hasan Abbas Sorathiya' }}" \
            --dart-define=DEFAULT_LOCALE="${{ secrets.DEFAULT_LOCALE || 'en' }}" \
            --dart-define=SUPPORTED_LOCALES="${{ secrets.SUPPORTED_LOCALES || 'en,ar,fr' }}" \
            --dart-define=ENABLE_ANALYTICS="${{ secrets.ENABLE_ANALYTICS || 'true' }}" \
            --dart-define=ENABLE_CRASH_REPORTING="${{ secrets.ENABLE_CRASH_REPORTING || 'true' }}" \
            --web-renderer canvaskit \
            --source-maps

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "❌ Build output directory not found"
            exit 1
          fi
          if [ ! -f "build/web/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Firebase CLI and dependencies
        run: |
          npm install -g firebase-tools@latest
          sudo apt-get update && sudo apt-get install -y jq || true

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          # Write service account JSON to file
          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          
          # Verify JSON is valid (using Python if jq is not available)
          if command -v jq &> /dev/null; then
            if ! jq empty $HOME/firebase-service-account.json 2>/dev/null; then
              echo "❌ Invalid JSON in FIREBASE_SERVICE_ACCOUNT"
              exit 1
            fi
          else
            if ! python3 -m json.tool $HOME/firebase-service-account.json > /dev/null 2>&1; then
              echo "❌ Invalid JSON in FIREBASE_SERVICE_ACCOUNT"
              exit 1
            fi
          fi
          
          # Set Firebase project
          firebase use hasan-abbas-portfolio
          
          # Verify authentication
          echo "✅ Firebase authentication verified"

      - name: Deploy Preview to Firebase Hosting
        id: deploy-preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json
        run: |
          # Generate a unique preview channel name based on PR number
          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHANNEL_NAME="pr-$PR_NUMBER"
          
          echo "Deploying to preview channel: $CHANNEL_NAME"
          
          firebase hosting:channel:deploy "$CHANNEL_NAME" \
            --project hasan-abbas-portfolio \
            --expires 30d
          
          PREVIEW_URL="https://hasan-abbas-portfolio--${CHANNEL_NAME}.web.app"
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "CHANNEL_NAME=$CHANNEL_NAME" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.PREVIEW_URL }}
          CHANNEL_NAME: ${{ steps.deploy-preview.outputs.CHANNEL_NAME }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const channelName = process.env.CHANNEL_NAME;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment successful!\n\n🌐 Preview URL: ${previewUrl}\n\nThis preview will expire in 30 days.`
            });

