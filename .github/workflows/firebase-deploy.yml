name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "TURSO_URL=${{ secrets.TURSO_URL }}" > .env
          echo "TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}" >> .env
          echo "APP_NAME=Portfolio" >> .env
          echo "DEFAULT_LOCALE=en" >> .env

      - name: Build Web App
        run: flutter build web --release --dart-define=TURSO_URL="${{ secrets.TURSO_URL }}" --dart-define=TURSO_TOKEN="${{ secrets.TURSO_TOKEN }}"

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
